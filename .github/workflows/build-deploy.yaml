name: Build and Push

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**.md"
  # Auch Pull Requests gegen dev pruefen (wie in openeos-shop). Veroeffentlicht
  # wird dabei nichts: der Push ins Registry haengt an
  # `github.event_name != 'pull_request'`, und die Deploy-Jobs verlangen ein
  # `push`-Ereignis.
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      force:
        description: 'Produktion: Deploy-Schutz übergehen (auch während eines Festes ausrollen)'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Build (type check)
        run: pnpm build

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* vars must be present at `next build` time — they're
          # inlined into the client bundle. These are non-secret (visible in
          # the browser anyway), so hardcoding the production URLs here is
          # fine. To override per environment, switch to ${{ vars.* }}.
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ github.ref == 'refs/heads/dev' && 'https://app.staging.openeos.de' || 'https://app.openeos.de' }}
            NEXT_PUBLIC_API_URL=${{ github.ref == 'refs/heads/dev' && 'https://api.staging.openeos.de' || 'https://api.openeos.de' }}
            NEXT_PUBLIC_DOCS_URL=https://docs.openeos.de
            NEXT_PUBLIC_CONTACT_EMAIL=hello@openeos.de
            NEXT_PUBLIC_DEMO_EMAIL=hello@openeos.de
            NEXT_PUBLIC_SITE_URL=${{ github.ref == 'refs/heads/dev' && 'https://staging.openeos.de' || 'https://openeos.de' }}
            NEXT_PUBLIC_SITE_ENV=${{ github.ref == 'refs/heads/dev' && 'staging' || 'production' }}

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build-and-push
    # Auch per "Run workflow" auf main — mit force=true ohne Deploy-Schutz.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    # Der Deploy-Schutz wartet bis zu 90 Minuten.
    timeout-minutes: 120
    concurrency:
      group: deploy-production-${{ github.repository }}
      cancel-in-progress: false
    steps:
      # Kein Ausrollen, solange eine Veranstaltung verkauft (echte Bestellungen
      # in den letzten 30 min): alle 5 min neu fragen, nach 90 min abbrechen.
      - name: Deploy guard
        uses: OpenEOS-Project/.github/actions/deploy-guard@main
        with:
          token: ${{ secrets.DEPLOY_GUARD_TOKEN }}
          url: ${{ vars.DEPLOY_GUARD_URL }}
          force: ${{ inputs.force && 'true' || 'false' }}

      - name: Determine SSH port
        id: ssh-port
        run: echo "port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}

      - name: Update production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.ssh-port.outputs.port }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH || format('/srv/docker/{0}', github.event.repository.name) }}
            docker compose pull ${{ vars.DEPLOY_SERVICE }}
            docker compose up -d ${{ vars.DEPLOY_SERVICE }}
            docker image prune -f

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Determine SSH port
        id: ssh-port
        run: echo "port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}

      - name: Update staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.ssh-port.outputs.port }}
          script: |
            set -e
            cd ${{ vars.STAGING_DEPLOY_PATH || format('/srv/docker/staging/{0}', github.event.repository.name) }}
            docker compose pull ${{ vars.DEPLOY_SERVICE }}
            docker compose up -d ${{ vars.DEPLOY_SERVICE }}
            docker image prune -f
